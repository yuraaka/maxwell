[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maxwell-maintainer"
version = "0.1.0"
description = "Manual repository discovery with durable GitHub issue reports"
requires-python = ">=3.12"
dependencies = [
    "argcomplete>=3.6,<4",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "PyYAML>=6,<7",
]

[project.scripts]
maxwell = "maxwell.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/maxwell"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
